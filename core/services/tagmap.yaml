MODELS_TO_TAG:
  Artist:
    name: artist

  Track:
    title: title
    duration: duration  # Обычно длительность берётся из файла напрямую
    bpm: bpm
    key: key  # Не указан в UNIFIED_TAGS — можно добавить при необходимости
    year: release_year
    track_number: track_number
    energy_level: energy_level  # Аналитика, не хранится в тегах
    mood: mood
    loudness: track_gain
    dynamic_range: dynamic_range  # Нет соответствия

  AudioFile:
    file_path: file_path  # Извлекается извне, не из тегов
    file_format: file_type
    file_size: file_size  # Извлекается на уровне системы
    bit_rate: bit_rate  # Тоже извлекается из файла
    sample_rate: sample_rate  # Аналогично
    hash: hash  # Внутреннее поле
    channels: channels  # Не в тегах
    bit_depth: bit_depth  # Аналогично
    cue_sheet_path: cue_sheet_path  # Вне стандартных тегов

  Genre:
    name: genre

  RecordLabel:
    name: label
    country: location

  Album:
    title: album
    release_date: release_date
    release_year: release_year
    cover_path: cover_path
    album_type: media_type  # Относительно, если указана категория
    total_tracks: tracktotal
    disc_count: disctotal
    compilation: compilation
    barcode: barcode

CUE_TAGS:
